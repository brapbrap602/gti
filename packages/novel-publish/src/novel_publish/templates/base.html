<!DOCTYPE html>
<html lang="{{ lang | default('en') }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script>
    // Text settings before first paint. site.js changes them through readerSettings.apply,
    // which validates every field (an unknown or missing one gets its default) and returns them all.
    window.readerSettings = (function () {
        var KEY = 'reader:settings', SCALES = [0.9, 1, 1.1, 1.2, 1.35];
        var THEMES = ['system', 'light', 'dark', 'sepia'], FONTS = ['sans', 'serif'];
        var LEADING = {compact: 1.6, normal: 1.8, loose: 2}, MEASURE = {narrow: '60ch', normal: '68ch', wide: '80ch'};
        var light = matchMedia('(prefers-color-scheme: light)'), current;
        function pick(value, allowed, fallback) {
            return allowed.indexOf(value) >= 0 ? value : fallback;
        }
        function apply(s) {
            s = s || {};
            current = {
                scale: SCALES[s.scale] ? s.scale : 1,
                theme: pick(s.theme, THEMES, 'dark'),
                font: pick(s.font, FONTS, 'sans'),
                spacing: LEADING.hasOwnProperty(s.spacing) ? s.spacing : 'normal',
                width: MEASURE.hasOwnProperty(s.width) ? s.width : 'normal'
            };
            var root = document.documentElement;
            root.dataset.theme = current.theme === 'system' ? (light.matches ? 'light' : 'dark') : current.theme;
            root.dataset.font = current.font;
            root.style.setProperty('--r-scale', SCALES[current.scale]);
            root.style.setProperty('--r-leading', LEADING[current.spacing]);
            root.style.setProperty('--r-measure', MEASURE[current.width]);
            return current;
        }
        light.addEventListener('change', function () { apply(current); });
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
        apply(saved);
        return {key: KEY, apply: apply, scales: SCALES, current: function () { return current; }};
    })();
    </script>
    <link rel="stylesheet" href="{{ root }}assets/style.css?v={{ assets_v }}">
    <script src="{{ root }}assets/site.js?v={{ assets_v }}" defer></script>
</head>
<body>
<div class="calibre">
{% block body %}{% endblock %}
</div>
</body>
</html>

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - name: Secret scan
        run: uv run python tools/secret_scan.py
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest

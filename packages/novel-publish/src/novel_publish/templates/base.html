<!DOCTYPE html>
<html lang="{{ lang | default('en') }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ root }}assets/style.css?v={{ assets_v }}">
    <script src="{{ root }}assets/site.js?v={{ assets_v }}" defer></script>
</head>
<body>
<div class="calibre">
{% block body %}{% endblock %}
</div>
<button class="scroll-to-top" id="scrollToTopBtn" aria-label="Scroll to top"></button>
</body>
</html>

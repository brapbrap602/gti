[project]
name = "novel-sources"
version = "0.1.0"
description = "Source backends, fetching, normalization and legacy importers"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "ftfy>=6.2",
    "lightnovel-crawler==4.14.0",
    "lncrawl-scraper~=1.7.0",
    "lxml>=5.3",
    "novel-core",
    "novel-downloader~=3.1.1",
    "opencc>=1.1.9",
    "web-novel-scraper~=2.2.1",
]

[tool.uv.sources]
novel-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

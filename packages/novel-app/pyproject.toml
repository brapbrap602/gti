[project]
name = "novel-app"
version = "0.1.0"
description = "Service, job runner, CLI and local web UI"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "novel-sources",
    "novel-publish",
    "novel-audio",
    "novel-translate",
    "typer>=0.15",
    "fastapi>=0.150",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",
    "jinja2>=3.1",
    "markdown-it-py>=4.2",
]

[project.scripts]
nov = "novel_app.cli:app"

[tool.uv.sources]
novel-sources = { workspace = true }
novel-publish = { workspace = true }
novel-audio = { workspace = true }
novel-translate = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

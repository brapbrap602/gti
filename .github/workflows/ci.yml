name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.7"
      - name: Install ffmpeg (audio tests join, tag and encode real files)
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --locked
      - name: Secret scan
        run: uv run python tools/secret_scan.py
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest
